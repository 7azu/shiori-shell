# Music folder: must match the shiori-shell setting "music" (~/.config/shiori-shell/settings.json)
music_directory "~/Music"
playlist_directory "~/Music"

# Only reachable locally: without this mpd listens on all networks, and anyone on the Wi-Fi/LAN
# could control the music without a password. rmpc, mpd-mpris and Quickshell use 127.0.0.1.
bind_to_address "127.0.0.1"
# Deliberately NO Unix socket: $XDG_RUNTIME_DIR/mpd/ does not exist after a reboot, mpd then
# aborts while binding. Without a socket file mpd-mpris automatically uses 127.0.0.1:6600.

auto_update "yes"
restore_paused "yes"

audio_output {
	type "pulse"
	name "pulse"
}
