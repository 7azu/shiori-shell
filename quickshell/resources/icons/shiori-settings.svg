<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icon of the settings window in the launcher: a star on a violet tile, a girl looking out from behind it.
       Drawn for shiori-shell. No filters, masks or clip paths: Qt's SVG renderer does not draw them. -->
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#9577ff"/>
      <stop offset="0.45" stop-color="#6f49ee"/>
      <stop offset="1" stop-color="#4d29cc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0.52" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.66" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3ad8"/>
      <stop offset="1" stop-color="#b9a6ff"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bba6ff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#tile)"/>
  <g fill="#fff" opacity="0.2"><path d="M 40 37 Q 41.1 44.9 49 46 Q 41.1 47.1 40 55 Q 38.9 47.1 31 46 Q 38.9 44.9 40 37 Z"/><path d="M 216 37 Q 217.1 44.9 225 46 Q 217.1 47.1 216 55 Q 214.9 47.1 207 46 Q 214.9 44.9 216 37 Z"/></g>

  <!-- the girl: hair behind, shoulders (down to the edge of the tile), neck, head, eyes, fringe, the long lock with its clip -->
  <path fill="#4326bb" d="M 46 150 C 30 96 48 16 128 12 C 208 16 226 96 210 150 C 206 166 196 172 184 166 C 187 144 188 122 188 100 L 68 100 C 68 122 69 144 72 166 C 60 172 50 166 46 150 Z"/>
  <path fill="#7d62ee" d="M 112 192 C 84 196 48 204 20.6 223.4 A 62 62 0 0 0 70 248 L 186 248 A 62 62 0 0 0 235.4 223.4 C 208 204 172 196 144 192 Z"/>
  <path fill="#a08af1" d="M 112 166 L 144 166 L 144 194 C 138 202 118 202 112 194 Z"/>
  <path fill="#bcaafd" d="M 66 96 C 66 60 96 40 128 40 C 160 40 190 60 190 96 C 190 136 160 170 128 176 C 96 170 66 136 66 96 Z"/>
  
    <ellipse cx="93" cy="114" rx="13.5" ry="16.5" fill="#22106f"/>
    <ellipse cx="93" cy="117" rx="9" ry="11.5" fill="url(#iris)"/>
    <circle cx="88" cy="108" r="4.6" fill="#fff"/>
    <circle cx="98" cy="122" r="2.2" fill="#fff" opacity=".8"/>
    <path d="M 75 107 Q 93 87 111 107 Q 93 95 75 107 Z" fill="#22106f" stroke="#22106f" stroke-width="2" stroke-linejoin="round"/>
  
    <ellipse cx="163" cy="114" rx="13.5" ry="16.5" fill="#22106f"/>
    <ellipse cx="163" cy="117" rx="9" ry="11.5" fill="url(#iris)"/>
    <circle cx="158" cy="108" r="4.6" fill="#fff"/>
    <circle cx="168" cy="122" r="2.2" fill="#fff" opacity=".8"/>
    <path d="M 145 107 Q 163 87 181 107 Q 163 95 145 107 Z" fill="#22106f" stroke="#22106f" stroke-width="2" stroke-linejoin="round"/>
  <path fill="#4326bb" d="M 60 106 C 50 56 86 22 128 20 C 170 22 206 56 196 106 C 190 96 186 86 185 74 C 178 82 168 87 156 88 C 160 80 160 72 158 64 C 148 78 134 86 118 88 C 122 80 122 72 120 64 C 110 78 92 88 76 90 C 70 94 64 100 60 106 Z"/>
  <path fill="none" stroke="#6143dc" stroke-width="6" stroke-linecap="round" d="M 84 44 C 106 30 150 28 174 42"/>
  <path fill="#4326bb" d="M 54 92 C 42 150 44 200 52 232 C 58 240 70 240 76 232 C 72 200 73 150 84 94 Z"/>
  <path fill="none" stroke="#f1ecff" stroke-width="4.5" stroke-linecap="round" d="M 49 189 L 77 205 M 77 189 L 49 205"/>

  <!-- the star, with a soft shadow below it so it stands off the face -->
  <path d="M 128 85 Q 135.0 148.0 198 155 Q 135.0 162.0 128 225 Q 121.0 162.0 58 155 Q 121.0 148.0 128 85 Z" fill="#1c0b6b" opacity="0.32" stroke="#1c0b6b" stroke-width="12" stroke-linejoin="round"/>
  <path d="M 128 80 Q 135.0 143.0 198 150 Q 135.0 157.0 128 220 Q 121.0 157.0 58 150 Q 121.0 143.0 128 80 Z" fill="url(#star)" stroke="url(#star)" stroke-width="9" stroke-linejoin="round"/>
  <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#sheen)"/>
  <rect x="9" y="9" width="238" height="238" rx="61" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2"/>
</svg>
