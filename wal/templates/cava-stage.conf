; cava for the stage on workspace 1 (hypr: scripts/start.sh, modules/home.lua).
; wal template -> ~/.cache/wal/cava-stage.conf, follows the wallpaper colors
; (wallpaper-apps.sh tells the running cava to reload it).
;
; Look: fine comb of thin bars with soft wave shapes. Stereo mirrors the bass into the middle,
; so the colors run from deep at the edges to bright in the middle, and every bar blends
; into near-white towards its tip.

[general]
framerate = 60
; slightly livelier than the default 100 (autosens adapts only slowly, so this is
; effectively a factor of about 1.3 on the bar heights)
sensitivity = 130
; in terminal cells
bar_width = 1
bar_spacing = 1

[color]
; no background color = kitty's (transparent) background
gradient = 1
gradient_color_1 = '{color7}'
gradient_color_2 = '{color7}'
horizontal_gradient = 1
horizontal_gradient_color_1 = '{color1}'
horizontal_gradient_color_2 = '{color3}'
horizontal_gradient_color_3 = '{color5}'
horizontal_gradient_color_4 = '{color6}'
horizontal_gradient_color_5 = '{color5}'
horizontal_gradient_color_6 = '{color3}'
horizontal_gradient_color_7 = '{color1}'
; vertical gradient blends in from the bottom: horizontal colors at the base, color7 at the top
blend_direction = 'up'

[smoothing]
; "Monstercat" smoothing with waves: neighbors follow a peak -> soft hills instead of spikes
monstercat = 1
waves = 1
