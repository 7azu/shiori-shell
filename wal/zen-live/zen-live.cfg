// zen-live.cfg (the first line must be a comment)
// Live colors for Zen: watches the wal color file and on every change sets the
// background color of the transparent Zen mod in the running browser - no restart needed.
// It also reloads ~/.cache/wal/zen-youtube.css (YouTube in wal colors) live.
// The background color crossfades softly (see fadeCss); Quickshell already writes colors-zen.txt
// at the start of the wallpaper wave (services/TerminalColorFade.qml), wal the same value later.
// Source: ~/.config/wal/zen-live/, installed to /opt/zen-browser-bin/ by install.sh
// (a pacman hook puts it back after Zen updates).
try {
    const { classes: Cc, interfaces: Ci } = Components;
    const Svc = globalThis.Services;
    const PREF = "mod.sameerasw.zen_transparency_color";
    const UPDATE_PREF = "zen.mods.updated-value-observer";
    const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
    // Overridable for tests; otherwise $XDG_CACHE_HOME or ~/.cache
    const walDir = (env.get("XDG_CACHE_HOME") || (env.get("HOME") + "/.cache")) + "/wal";
    const colorPath = env.get("ZEN_LIVE_COLOR_FILE") || (walDir + "/colors-zen.txt");
    // YouTube in wal colors (template ~/.config/wal/templates/zen-youtube.css) and more sites
    // (generated by ~/.config/wal/zen/zen-sites.py build)
    const cssPaths = [env.get("ZEN_LIVE_CSS_FILE") || (walDir + "/zen-youtube.css"), walDir + "/zen-sites.css"];

    const fileAt = (path) => {
        const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        f.initWithPath(path);
        return f;
    };

    // Returns the file only if it has changed since the last call
    const changed = (state, path) => {
        const f = fileAt(path);
        if (!f.exists())
            return null;
        const mtime = f.lastModifiedTime;
        if (mtime === state.mtime)
            return null;
        state.mtime = mtime;
        return f;
    };

    const readText = (f) => {
        const fis = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
        fis.init(f, -1, 0, 0);
        const sis = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
        sis.init(fis);
        const text = sis.read(sis.available());
        sis.close();
        fis.close();
        return text;
    };

    const colorState = { mtime: -1 };
    const applyColor = () => {
        const f = changed(colorState, colorPath);
        if (!f)
            return;
        const c = readText(f).trim();
        // Only valid hex colors (#rgb, #rrggbb, #rrggbbaa)
        if (/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(c) && Svc.prefs.getStringPref(PREF, "") !== c) {
            Svc.prefs.setStringPref(PREF, c);
            // Zen only writes mod values into the appearance when this signal toggles
            // (like gZenMods.triggerModsUpdate() in the mod settings)
            Svc.prefs.setBoolPref(UPDATE_PREF, !Svc.prefs.getBoolPref(UPDATE_PREF, false));
        }
    };

    // User stylesheet like userContent.css, but swappable: register the new version, unregister
    // the old one; open tabs recolor right away. As a data: URI with the content, because
    // Firefox treats file:// sheets with the same path (even with "?v=") as the same sheet.
    const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
    const cssApplier = (cssPath) => {
        const cssState = { mtime: -1, uri: null };
        return () => {
            const f = changed(cssState, cssPath);
            if (!f)
                return;
            const uri = Svc.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(readText(f)));
            if (cssState.uri?.equals(uri))
                return;
            try {
                sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
            } catch (e) {
                cssState.mtime = -1; // try again on the next pass
                throw e;
            }
            if (cssState.uri && sss.sheetRegistered(cssState.uri, sss.USER_SHEET))
                sss.unregisterSheet(cssState.uri, sss.USER_SHEET);
            cssState.uri = uri;
        };
    };
    const cssSteps = cssPaths.map(cssApplier);

    const apply = () => {
        for (const step of [applyColor, ...cssSteps]) {
            try {
                step();
            } catch (e) {
                console.error("zen-live: " + e);
            }
        }
    };

    // Soft color change: register the mod color as <color>, only then Firefox can animate it.
    // Zen sets it inline on :root when it changes; the transition only sits on the background element
    // (.zen-browser-generic-background, contain: size style), which inherits it -> per frame only this
    // small subtree is recomputed, not the whole UI. Duration/curve as in Quickshell (colorMs).
    // Per window as a document sheet, so websites get nothing of it.
    const fadeCss = '@property --mod-sameerasw-zen_transparency_color { syntax: "<color>"; inherits: true; initial-value: #00000000; }\n'
        + ".zen-browser-generic-background { transition: --mod-sameerasw-zen_transparency_color 900ms cubic-bezier(0.455, 0.03, 0.515, 0.955); }";
    const fadeUri = "data:text/css;charset=utf-8," + encodeURIComponent(fadeCss);
    globalThis.__zenLiveFade = {
        observe(win) {
            try {
                win.windowUtils.loadSheetUsingURIString(fadeUri, Ci.nsIDOMWindowUtils.AUTHOR_SHEET);
            } catch (e) {
                console.error("zen-live: Farbblende: " + e);
            }
        }
    };
    Svc.obs.addObserver(globalThis.__zenLiveFade, "browser-delayed-startup-finished");

    // Websites (zen-youtube.css): register the base colors there as <color>, so their
    // transition fades softly. Own author sheet only with @property (affects no page,
    // only the names --wal-* become animatable); Firefox does not reliably respect @property from user sheets.
    // Everything else stays in the swappable user sheet.
    const walProps = ["--wal-bg", "--wal-fg", "--wal-accent"]
        .map((name) => `@property ${name} { syntax: "<color>"; inherits: true; initial-value: #00000000; }`)
        .join("\n");
    try {
        sss.loadAndRegisterSheet(Svc.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(walProps)), sss.AUTHOR_SHEET);
    } catch (e) {
        console.error("zen-live: Farbregistrierung: " + e);
    }

    apply();
    // Hold the reference globally, otherwise the garbage collector removes the timer.
    // 200 ms instead of 1.5 s: Quickshell writes the new color at the start of the wallpaper wave, Zen should
    // start fading at the same time (only two stat calls per pass)
    globalThis.__zenLiveTimer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    globalThis.__zenLiveTimer.initWithCallback({ notify: apply }, 200, Ci.nsITimer.TYPE_REPEATING_SLACK);
} catch (e) {
    console.error("zen-live: start failed: " + e);
}
