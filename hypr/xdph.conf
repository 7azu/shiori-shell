# xdg-desktop-portal-hyprland (screen sharing for Discord/Vesktop, browsers, OBS)
screencopy {
    # Fast monitors run at up to 240 Hz, but Discord & co. stream at most 60 fps.
    # Without a limit the portal grabs every frame -> needless load, stutter in the stream.
    max_fps = 60

    # Allow remembering the selection ("Allow restore token" checked by default): Vesktop/Electron asks
    # several times in a row when a share starts and asks for persist_mode -> without a token
    # every request opened its own picker window.
    allow_token_by_default = true
}
