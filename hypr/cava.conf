; cava for the stage on workspace 1 (scripts/start.sh, modules/home.lua):
; a strip without background at the bottom edge of the screen

[general]
framerate = 60
; width of a bar and the gap between bars, in terminal cells
bar_width = 3
bar_spacing = 1

[color]
; terminal palette color = wal color5 (same as the active window border),
; so it follows the wallpaper colors
foreground = magenta
