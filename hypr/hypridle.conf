# hypridle fallback: only used when quickshell/scripts/idle_config.py cannot write the configuration.
# Normally hypr/scripts/idle.sh starts hypridle with the steps from the shell settings ("idle":
# darker, lock, monitors off, standby). These are the same as the defaults there.
# Playing videos/games/calls keep the machine awake (idle inhibit), then nothing happens.

general {
    # Quickshell lock screen; lock.sh itself makes sure only one runs at a time (flock)
    lock_cmd = $HOME/.config/hypr/scripts/lock.sh
    # Lock before suspend, so the machine is not open when it wakes up
    before_sleep_cmd = loginctl lock-session
    # After waking up: monitors on, then the fan colors again (the USB controller is re-initialized on
    # resume). Wait briefly until the devices are back; without openrgb.service nothing happens.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; sleep 3; systemctl --user restart openrgb.service
}

# Darker after 3 minutes (Quickshell overlay)
listener {
    timeout = 180
    on-timeout = qs ipc call idle dim
    on-resume = qs ipc call idle undim
}

# Lock after 4 minutes
listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

# Monitors off after 8 minutes
listener {
    timeout = 480
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

