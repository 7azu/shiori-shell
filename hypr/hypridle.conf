# hypridle: lock the screen automatically when you are away from the PC (started from autostart.lua)
# Playing videos/games/calls keep the machine awake (idle inhibit), then it does not lock.

general {
    # Quickshell lock screen; lock.sh itself makes sure only one runs at a time (flock)
    lock_cmd = $HOME/.config/hypr/scripts/lock.sh
    # Lock before suspend, so the machine is not open when it wakes up
    before_sleep_cmd = loginctl lock-session
    # After waking up, set the fan colors again (the USB controller is re-initialized on resume).
    # Wait briefly until the devices are back; without openrgb.service (other machines) nothing happens.
    after_sleep_cmd = sleep 3; systemctl --user restart openrgb.service
}

# Lock after 10 minutes without input
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
