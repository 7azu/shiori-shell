set -g default-terminal "xterm-kitty"

# Image previews (yazi, also in nvim): pass kitty graphics commands through tmux,
# instead of opening images with ueberzugpp as a separate window
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Status bar without its own color (the tmux default is bright green): the terminal's background
# (pywal via kitty), in nvim vim-tpipeline fills the content with the lualine line
set -g status-style bg=default,fg=default

# Separator line between panes: the terminal palette (colourN) instead of tmux's own theme* colors,
# so pywal colors it along via kitty (color4 active, color8 inactive)
set -g pane-border-style fg=colour8
set -g pane-active-border-style fg=colour4

# Copy mode also with the pywal palette (colour0 = dark background as text)
set -g mode-style bg=colour4,fg=colour0                     # selection
set -g copy-mode-match-style bg=colour2,fg=colour0          # search hits
set -g copy-mode-current-match-style bg=colour3,fg=colour0  # current search hit
set -g copy-mode-mark-style bg=colour1,fg=colour0           # set mark
set -g copy-mode-line-number-style fg=colour8
set -g copy-mode-current-line-number-style fg=colour4

unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-Space
bind C-Space send-prefix

unbind %
bind v split-window -h

unbind '"'
bind s split-window -v

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Move the separator line with Alt+Shift+h/j/k/l (without the prefix)
bind-key -n M-H resize-pane -L 5
bind-key -n M-J resize-pane -D 5
bind-key -n M-K resize-pane -U 5
bind-key -n M-L resize-pane -R 5

# PLUGINS #
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Ctrl+h/j/k/l jumps seamlessly between nvim splits and tmux panes (counterpart in nvim:
# plugins/tmux-navigator.lua). Clear the screen in the shell then with prefix + Ctrl+l.
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_prev ''   # no Ctrl+\ (in nvim it belongs to Ctrl+\ Ctrl+n)


run '~/.config/tmux/plugins/tpm/tpm'
